name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            foody-ar-farm/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Install Foody dependencies
        run: npm ci --prefix foody-ar-farm
      - name: Verify Foody gameplay
        run: npm test --prefix foody-ar-farm
      - name: Build Foody subpage
        working-directory: foody-ar-farm
        env:
          FOODY_BASE_PATH: /lab/foody-ar-game/
        run: npm run build
      - name: Include Foody in the site
        run: |
          mkdir -p dist/lab/foody-ar-game
          cp -R foody-ar-farm/dist/. dist/lab/foody-ar-game/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
