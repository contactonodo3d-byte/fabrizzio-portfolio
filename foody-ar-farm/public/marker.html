<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcador Foody para imprimir</title><style>body{font-family:Arial,sans-serif;text-align:center;margin:20px;color:#274e43}img{width:min(100%,180mm);height:auto;image-rendering:pixelated}button,a{font-size:16px;padding:12px;margin:10px;display:inline-block}@media print{button,a{display:none}body{margin:0}img{width:180mm}@page{size:A4;margin:10mm}}</style><h1>Marcador Foody</h1><p>Imprimí en una hoja plana o mostralo en otra pantalla. Mantené visible todo el borde blanco.</p><img src="branding/foody-marker.svg" width="600" height="600" alt="Marcador visual Foody número 7"><p>Rastreo relativo al marcador. Maqueta de escala aproximada; no mide un área física de 3 × 3 m.</p><button onclick="window.print()">Imprimir marcador</button><a href="./">Volver a la granja</a></html>
